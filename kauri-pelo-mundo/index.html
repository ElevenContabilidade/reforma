<title>Kauri pelo mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: faixa bordô da marca + cartão da viagem com contagem regressiva; abas roláveis; roteiro em colunas por dia (rolagem lateral). */
:root {
  --bg: #f7f2f0;
  --surface: #ffffff;
  --surface-2: #f3ebe8;
  --ink: #2a1214;
  --muted: #7b6466;
  --line: #e9dcd8;
  --wine: #8c2426;
  --wine-soft: #fbeeee;
  --gold: #c9922b;
  --gold-soft: #fbf1d7;
  --gold-ink: #7a5714;
  --band: #6b1013;
  --band-2: #8c2426;
  --on-band: #fbf1d7;
  --on-wine: #ffffff;
  --ok: #2f7a4f;
  --ok-soft: #e3f2e9;
  --danger: #b3261e;
  --board: #efe3df;
  --shadow: 0 1px 2px rgba(41, 6, 8, .06), 0 6px 20px rgba(41, 6, 8, .07);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160b0c; --surface: #221315; --surface-2: #2c191b; --ink: #f6ece9; --muted: #b59f9f;
    --line: #3b2427; --wine: #e08a8c; --wine-soft: #3a1a1c; --gold: #e3b14e; --gold-soft: #3a2a12;
    --gold-ink: #f3d48f; --band: #3d0a0b; --band-2: #530d0f; --on-band: #fbf1d7; --on-wine: #1a0405;
    --ok: #7fcf9f; --ok-soft: #173325; --danger: #ff8a80; --board: #1d1012;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #160b0c; --surface: #221315; --surface-2: #2c191b; --ink: #f6ece9; --muted: #b59f9f;
  --line: #3b2427; --wine: #e08a8c; --wine-soft: #3a1a1c; --gold: #e3b14e; --gold-soft: #3a2a12;
  --gold-ink: #f3d48f; --band: #3d0a0b; --band-2: #530d0f; --on-band: #fbf1d7; --on-wine: #1a0405;
  --ok: #7fcf9f; --ok-soft: #173325; --danger: #ff8a80; --board: #1d1012;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; }
svg.i { width: 18px; height: 18px; flex: none; }

/* Faixa da marca */
.band { background: linear-gradient(135deg, var(--band), var(--band-2)); color: var(--on-band); padding-block: 16px 64px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; line-height: 1; }
.brand-name span { color: var(--gold); }
.brand-sub { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-top: 3px; }
.trip-picker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.trip-picker select { background: rgba(251, 241, 215, .12); border: 1px solid rgba(251, 241, 215, .3); color: var(--on-band); border-radius: 8px; padding: 7px 10px; max-width: 200px; }
.trip-picker select option { color: #2a1214; background: #fff; }
.btn-band { background: transparent; border: 1px solid rgba(251, 241, 215, .4); color: var(--on-band); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; }
.btn-band:hover { background: rgba(251, 241, 215, .12); }

/* Cartão da viagem */
.trip-card { margin-top: -48px; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; position: relative; }
.trip-top { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); }
.trip-cover { width: 76px; height: 76px; border-radius: 14px; background: linear-gradient(160deg, var(--band-2), var(--band)); display: grid; place-items: center; }
.trip-top .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); font-weight: 800; }
.trip-top h1 { font-size: clamp(20px, 4.6vw, 28px); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; overflow-wrap: anywhere; }
.trip-dates { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin-top: 4px; }
.trip-edit { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; color: var(--muted); display: flex; }
.trip-bottom { padding: 18px 16px 20px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.trip-bottom h2 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.cd { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
.cd-unit { display: grid; gap: 4px; justify-items: center; }
.cd-unit .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.cd-digits { display: flex; gap: 5px; }
.cd-digits span { width: 38px; height: 48px; border-radius: 8px; background: var(--wine); color: var(--on-wine); font-family: var(--f-display); font-size: 30px; font-weight: 800; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.cd-msg { font-size: 15px; color: var(--muted); margin-top: 6px; }
.trip-illus { flex: none; }

/* Abas */
.tabs-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 14px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; padding: 12px 12px 10px; font-weight: 600; font-size: 15px; color: var(--muted); border-bottom: 3px solid transparent; display: flex; gap: 6px; align-items: center; }
.tab .count { font-size: 11px; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--wine); border-bottom-color: var(--wine); }

main { padding-block: 18px 120px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.section-head h2 { font-size: 22px; font-weight: 700; }
.section-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--wine); }
.btn-primary { background: var(--wine); border-color: var(--wine); color: var(--on-wine); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn-danger { color: var(--danger); }
.btn-danger.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }

/* Roteiro em colunas */
.day-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
.day-chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip.today { border-color: var(--gold); color: var(--gold-ink); }
.board { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 14px 16px 18px; margin-inline: -16px; background: var(--board); border-radius: 0; scroll-padding-inline: 16px; }
@media (min-width: 992px) { .board { margin-inline: 0; border-radius: 18px; } }
.col { flex: 0 0 min(84vw, 330px); scroll-snap-align: start; display: grid; gap: 10px; align-content: start; min-width: 0; }
.col-head { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
.col-head .d { font-weight: 800; font-family: var(--f-display); font-size: 17px; line-height: 1.1; }
.col-head .c { font-size: 13px; color: var(--muted); }
.col-head .date { margin-left: auto; font-size: 14px; color: var(--muted); white-space: nowrap; }
.col-head.today { outline: 2px solid var(--gold); }
.col-body { background: var(--surface); border-radius: 14px; padding: 12px; display: grid; gap: 0; box-shadow: var(--shadow); }
.act { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--surface); }
.act.done { opacity: .55; }
.act.done .act-title { text-decoration: line-through; }
.thumb { width: 56px; height: 56px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); }
.thumb svg { width: 26px; height: 26px; }
.t-voo { background: var(--wine); color: var(--on-wine); }
.t-hospedagem { background: var(--gold); color: #2a1214; }
.t-passagem { background: var(--ink); color: var(--bg); }
.t-Museu { background: var(--gold-soft); color: var(--gold-ink); }
.t-Restaurante { background: var(--wine-soft); color: var(--wine); }
.t-Compras { background: var(--gold-soft); color: var(--gold-ink); }
.t-Show { background: var(--wine-soft); color: var(--wine); }
.t-Passeio { background: var(--ok-soft); color: var(--ok); }
.act-main { min-width: 0; display: grid; gap: 6px; }
.act-top { display: flex; align-items: flex-start; gap: 6px; }
.act-title { font-weight: 700; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.icon-btn { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 0; display: grid; place-items: center; padding: 0; }
.icon-btn.edit { background: var(--wine); color: var(--on-wine); }
.icon-btn.check { background: var(--surface-2); color: var(--muted); border: 1.5px solid var(--line); }
.icon-btn.check[aria-pressed="true"] { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.icon-btn svg { width: 16px; height: 16px; }
.act-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.act-time { display: flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-weight: 700; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.act-time svg { color: var(--muted); }
.act-sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper button { width: 28px; height: 28px; border-radius: 8px; border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--ink); padding: 0; }
.stepper button:hover { background: var(--surface-2); }
.stepper .v { font-family: var(--f-mono); font-weight: 700; font-size: 14px; color: var(--wine); min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
.desloc { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 10px 4px; color: var(--muted); font-size: 14px; font-weight: 600; text-align: left; width: 100%; }
.desloc .grow { flex: 1; }
.desloc.set { color: var(--ink); }
.desloc .pen { width: 22px; height: 22px; border-radius: 6px; background: var(--wine); color: var(--on-wine); display: grid; place-items: center; }
.desloc .pen svg { width: 12px; height: 12px; }
.col-add { margin-top: 10px; border: 1.5px dashed var(--line); background: transparent; border-radius: 12px; padding: 10px; font-weight: 600; color: var(--muted); }
.col-add:hover { border-color: var(--wine); color: var(--wine); }
.col-empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }

/* Resumo */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.stat .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stat .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--muted); }
.stat.warn { border-color: var(--gold); }
.costs { background: var(--gold-soft); color: var(--gold-ink); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; font-size: 14px; }
.costs strong { font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.costs .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }

/* Linha do tempo */
.day { margin-bottom: 20px; }
.day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.dnum { font-family: var(--f-mono); font-size: 12px; color: var(--gold-ink); background: var(--gold-soft); padding: 2px 8px; border-radius: 6px; font-weight: 700; white-space: nowrap; }
.day-head h3 { font-size: 17px; font-weight: 700; text-transform: capitalize; }
.events { display: grid; gap: 6px; border-left: 2px solid var(--line); margin-left: 6px; padding-left: 16px; }
.event { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; }
.event::before { content: ""; position: absolute; left: -23px; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--dot, var(--wine)); transform: translateY(-50%); }
.event:hover { border-color: var(--wine); }
.event .time { font-family: var(--f-mono); font-size: 13px; font-weight: 700; color: var(--muted); }
.event .title { font-weight: 700; overflow-wrap: anywhere; }
.event .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.event.done .title { text-decoration: line-through; opacity: .6; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.tag-voo { background: var(--wine); color: var(--on-wine); }
.tag-hospedagem { background: var(--gold-soft); color: var(--gold-ink); }
.tag-passagem { background: var(--surface-2); color: var(--ink); }
.tag-roteiro { background: transparent; color: var(--muted); border: 1px solid var(--line); }

/* Cartão de embarque */
.cards { display: grid; gap: 14px; }
.pass { display: grid; grid-template-columns: minmax(0, 1fr) 170px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; text-align: left; width: 100%; padding: 0; }
.pass:hover { border-color: var(--wine); }
.pass-main { padding: 14px 18px 16px; min-width: 0; }
.pass-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.pass-top .carrier { color: var(--wine); font-weight: 800; }
.route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; margin-top: 10px; }
.route .code { font-family: var(--f-mono); font-size: clamp(28px, 7vw, 40px); font-weight: 700; line-height: 1; }
.route .code.station { font-family: var(--f-display); font-size: clamp(17px, 4vw, 22px); line-height: 1.15; overflow-wrap: anywhere; }
.route .city { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.route .when { font-family: var(--f-mono); font-size: 13px; font-weight: 700; margin-top: 4px; }
.route .end { text-align: right; }
.route .plane { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.pass-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.pass-meta b { display: block; color: var(--ink); font-family: var(--f-mono); font-size: 13px; }
.pass-stub { border-left: 2px dashed var(--line); position: relative; padding: 14px 16px; background: var(--surface-2); display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
.pass-stub::before, .pass-stub::after { content: ""; position: absolute; left: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.pass-stub::before { top: -11px; }
.pass-stub::after { bottom: -11px; }
.pass-stub .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pass-stub .loc { font-family: var(--f-mono); font-size: 22px; font-weight: 700; color: var(--wine); letter-spacing: .08em; overflow-wrap: anywhere; }
.pass-stub .price { font-family: var(--f-mono); font-size: 13px; font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: left; width: 100%; display: grid; gap: 8px; }
.card:hover { border-color: var(--wine); }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card-title { font-family: var(--f-display); font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
.card-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.stay-dates { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.stay-dates .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stay-dates .d { font-weight: 700; }
.stay-dates .nights { font-family: var(--f-mono); font-size: 12px; color: var(--gold-ink); background: var(--gold-soft); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.stay-dates .end { text-align: right; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 600; }
.mono { font-family: var(--f-mono); }
.pill-ok, .pill-pend { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-pend { background: var(--gold-soft); color: var(--gold-ink); }
.obs { font-size: 13px; color: var(--ink); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Listas (ingressos, gastronomia, documentos) */
.list { display: grid; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.row .thumb { width: 44px; height: 44px; }
.row .thumb svg { width: 22px; height: 22px; }
.row-title { font-weight: 700; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.group-label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; margin: 18px 0 8px; }
.group-label:first-child { margin-top: 0; }
a.link { color: var(--wine); font-weight: 700; text-decoration: none; }
a.link:hover { text-decoration: underline; }

/* Custos */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 800; background: var(--surface-2); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 13px; }
tr.total td { font-weight: 800; border-bottom: 0; }
.fx { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.fx label { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
.fx input { width: 90px; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--bg); }

.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 28px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h3 { color: var(--ink); font-size: 18px; }
.notice { font-size: 13px; background: var(--gold-soft); color: var(--gold-ink); border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; }

  }
  function tripDocs(tripId) {

      .filter(function (d) { return d.viagemId === tripId; })

  function sortKey(it) {

  // Eventos de um dia (para colunas e linha do tempo)
  function dayEvents(all, day) {

        if (it.chegada && it.chegada.slice(0, 10) === day && (it.partida || "").slice(0, 10) !== day) ev.push({ key: it.id + "-arr", it: it, time: hhmm(it.chegada), sortT: hhmm(it.chegada), icon: "plane", tcls: "t-voo", title: "Chegada em " + (it.destinoCidade || it.destino || ""), sub: (it.numero || "") + " · " + (it.destino || "") });
      } else if (it.tipo === "passagem") {
        if ((it.partida || "").slice(0, 10) === day) ev.push({ key: it.id, it: it, time: hhmm(it.partida), sortT: hhmm(it.partida), icon: "train", tcls: "t-passagem", title: (it.meio || "Passagem") + ": " + (it.origem || "") + (it.destino ? " → " + it.destino : ""), sub: [it.empresa, it.chegada ? "chega " + hhmm(it.chegada) : "", it.codigo].filter(Boolean).join(" · ") });

        if (it.checkin === day) ev.push({ key: it.id + "-in", it: it, time: it.horaCheckin || "", sortT: it.horaCheckin || "14:00", icon: "bed", tcls: "t-hospedagem", title: "Check-in: " + (it.nome || ""), sub: [it.cidade, it.reserva ? "Reserva " + it.reserva : ""].filter(Boolean).join(" · ") });

  }
  function dayCity(all, day) {

  // ---------- Renderização ----------
  var $ = function (id) { return document.getElementById(id); };

  function render() {
    var trip = currentTrip();
    try { if (state.tripId) localStorage.setItem("kauri-trip", state.tripId); } catch (e) {}
    renderPicker(trip);
    renderTripCard(trip);
    renderTabs(trip);
    renderMain(trip);
    $("fab").hidden = !trip;
  }

  function renderPicker(trip) {
    var sel = $("trip-select"), list = trips();
    sel.innerHTML = list.length ? list.map(function (t) { return '<option value="' + esc(t.id) + '"' + (trip && t.id === trip.id ? " selected" : "") + ">" + esc(t.nome) + "</option>"; }).join("") : "<option>Nenhuma viagem</option>";
    sel.disabled = !list.length;
  }

  function departure(trip) {
    var voos = tripItems(trip.id, "voo").filter(function (v) { return v.partida; });
    return voos.length ? parseDT(voos[0].partida) : parseDate(trip.inicio);
  }
  function countdownHTML(trip) {
    var now = new Date(), dep = departure(trip), end = parseDate(trip.fim);
    if (end) end.setHours(23, 59);
    if (dep && now < dep) {
      var ms = dep - now, d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60;
      var unit = function (v, lbl) { var s = String(v).padStart(2, "0"); return '<div class="cd-unit"><div class="lbl">' + lbl + '</div><div class="cd-digits">' + s.split("").map(function (c) { return "<span>" + c + "</span>"; }).join("") + "</div></div>"; };
      return "<h2>" + (d <= 60 ? "Está quase na hora!" : "Contagem para o embarque") + '</h2><div class="cd">' + unit(d, "dias") + unit(h, "horas") + unit(m, "minutos") + "</div>";
    }
    if (end && now <= end) {
      var n = daysBetween(trip.inicio, today()) + 1, tot = daysBetween(trip.inicio, trip.fim) + 1;
      return '<h2>Boa viagem!</h2><div class="cd-msg">Hoje é o dia ' + n + " de " + tot + ". Veja o roteiro de hoje na aba Roteiro.</div>";
    }
    return '<h2>Viagem concluída</h2><div class="cd-msg">' + (daysBetween(trip.inicio, trip.fim) + 1) + " dias de histórias.</div>";
  }
  var ILLUS = '<svg class="trip-illus" width="120" height="96" viewBox="0 0 120 96" aria-hidden="true"><g transform="rotate(-35 40 50)"><rect x="8" y="42" width="64" height="14" rx="7" fill="var(--gold)"/><rect x="30" y="22" width="12" height="54" rx="4" fill="var(--gold)" opacity=".75"/></g><rect x="70" y="30" width="44" height="62" rx="9" fill="var(--wine)"/><rect x="84" y="16" width="16" height="16" rx="3" fill="none" stroke="var(--wine)" stroke-width="4"/><path d="M80 40v44M92 40v44M104 40v44" stroke="var(--on-wine)" stroke-width="4" stroke-linecap="round" opacity=".55"/></svg>';

  function renderTripCard(trip) {
    var el = $("trip-card");

      el.innerHTML = '<div class="trip-top"><div class="trip-cover">' + ic("plane", "i") + '</div><div><div class="eyebrow">' + (allLoaded() ? "Bem-vinda" : "Carregando") + "</div><h1>O mundo te espera, Kauri.</h1></div></div>";
      return;
    }
    el.innerHTML = '<div class="trip-top"><div class="trip-cover"><svg width="40" height="40" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="#e0ad42" stroke-width="2"/><ellipse cx="18" cy="18" rx="6.5" ry="15" fill="none" stroke="#e0ad42" stroke-width="1.5"/><path d="M4 13h28M4 23h28" stroke="#e0ad42" stroke-width="1.5"/></svg></div>' +
      '<div style="min-width:0"><div class="eyebrow">' + esc(trip.nome) + "</div><h1>" + esc(trip.destino || trip.nome) + '</h1><div class="trip-dates">' + ic("cal") + esc(fmtLong(trip.inicio)) + " – " + esc(fmtLong(trip.fim)) + "</div></div>" +
      '<button class="trip-edit" type="button" id="btn-edit-trip" aria-label="Editar viagem">' + ic("pen") + "</button></div>" +
      (state.tab === "geral" ? '<div class="trip-bottom"><div id="countdown">' + countdownHTML(trip) + "</div>" + ILLUS + "</div>" : "");
  }

  function renderTabs(trip) {
    $("tabs").innerHTML = TABS.map(function (t) {
      var n = null;
      if (trip && t.tipo) n = tripItems(trip.id, t.tipo).length + (t.tipo === "voo" ? tripItems(trip.id, "passagem").length : 0);
      if (trip && t.id === "ingressos") n = tripItems(trip.id, "roteiro").filter(function (i) { return needsTicket(i) && !i.ingresso; }).length;

    }).join("");
  }

  function renderMain(trip) {
    var main = $("main");
    var notice = state.mode === "local" ? '<div class="notice">Modo offline: os dados ficam salvos só neste navegador. Abra pelo app do Claude, conectada à sua conta, para ver suas viagens.</div>' : "";

    if (!trip) {
      main.innerHTML = notice + '<div class="empty"><h3>Nenhuma viagem cadastrada</h3><p>Comece pelo nome, destino e datas.</p><button class="btn btn-primary" type="button" data-action="new-trip">Cadastrar primeira viagem</button></div>';
      return;
    }
    var keepScroll = null, board = main.querySelector(".board");
    if (board) keepScroll = board.scrollLeft;
    var v = {
      geral: viewGeral, roteiro: viewBoard, ingressos: viewIngressos, gastronomia: viewGastro, custos: viewCustos, documentos: viewDocs,
      voo: viewTransporte,
      hospedagem: function (t) { return viewList(t, "hospedagem", "Hospedagens", cardHospedagem); }
    }[state.tab];
    main.innerHTML = notice + v(trip);
    board = main.querySelector(".board");
    if (board) {
      if (keepScroll != null) board.scrollLeft = keepScroll;
      else if (!boardPositioned) { boardPositioned = true; var t = board.querySelector(".col-head.today"); if (t) board.scrollLeft = t.parentNode.offsetLeft - 16; }
    }

  var boardPositioned = false;

  // ---- Roteiro em colunas ----
  function tripDays(trip) { var out = [], n = daysBetween(trip.inicio, trip.fim); for (var i = 0; i <= (n || 0); i++) out.push(addDays(trip.inicio, i)); return out; }
  function viewBoard(trip) {
    var all = tripItems(trip.id), days = tripDays(trip), hoje = today();
    var chips = '<div class="day-chips">' + days.map(function (d, i) { return '<button type="button" class="chip' + (d === hoje ? " today" : "") + '" data-jump="' + i + '">Dia ' + (i + 1) + " · " + ddmm(d) + "</button>"; }).join("") + "</div>";
    var cols = days.map(function (day, i) {
      var ev = dayEvents(all, day);
      var body = ev.length ? ev.map(function (e, j) { return (j ? deslocRow(trip, day, e) : "") + actCard(e); }).join("") : '<div class="col-empty">Nada planejado ainda.</div>';
      return '<div class="col" data-col="' + i + '"><div class="col-head' + (day === hoje ? " today" : "") + '">' + ic("cal") + '<div><div class="d">Dia ' + (i + 1) + '</div><div class="c">' + esc(dayCity(all, day)) + '</div></div><div class="date">' + esc(fmtShortWd(day)) + "</div></div>" +
        '<div class="col-body">' + body + '<button type="button" class="col-add" data-add="roteiro" data-day="' + day + '">+ Adicionar atividade</button></div></div>';
    }).join("");
    return '<div class="section-head"><div><h2>Roteiro</h2><p>Arraste para o lado para ver os outros dias. Use − e + para ajustar a duração.</p></div></div>' + chips + '<div class="board" id="board">' + cols + "</div>";
  }
  function actCard(e) {
    var it = e.it;
    var right = "";
    if (e.act) right = '<div class="stepper"><button type="button" data-dur="' + esc(it.id) + '" data-step="-15" aria-label="Diminuir duração">−</button><span class="v">' + durFmt(it.duracao || 60) + '</span><button type="button" data-dur="' + esc(it.id) + '" data-step="15" aria-label="Aumentar duração">+</button></div>';
    var check = e.act ? '<button type="button" class="icon-btn check" data-toggle="' + esc(it.id) + '" aria-pressed="' + !!it.feito + '" aria-label="Marcar como feito">' + ic("check") + "</button>" : "";
    var badge = e.act && needsTicket(it) ? (it.ingresso ? ' <span class="pill-ok">Ingresso ok</span>' : ' <span class="pill-pend">Comprar ingresso</span>') : "";
    return '<div class="act' + (it.feito ? " done" : "") + '"><div class="thumb ' + e.tcls + '">' + ic(e.icon) + '</div><div class="act-main"><div class="act-top"><div class="act-title">' + esc(e.title) + badge + "</div>" + check +
      '<button type="button" class="icon-btn edit" data-edit="' + esc(it.id) + '" aria-label="Editar">' + ic("pen") + "</button></div>" +
      '<div class="act-row"><span class="act-time">' + ic("clock") + esc(e.time || "--:--") + "</span>" + right + "</div>" +
      (!e.act && e.sub ? '<div class="act-sub">' + esc(e.sub) + "</div>" : "") + "</div></div>";
  }
  function deslocKey(trip, day, e) { return (trip.id + "_" + day + "_" + e.key).replace(/[^A-Za-z0-9_\-]/g, "").slice(0, 180); }
  function deslocRow(trip, day, e) {
    var k = deslocKey(trip, day, e), d = state.deslocs[k];
    var txt = d ? [d.modo, d.min ? d.min + " min" : "", d.obs].filter(Boolean).join(" · ") : "Definir deslocamento";
    return '<button type="button" class="desloc' + (d ? " set" : "") + '" data-desloc="' + esc(k) + '">' + ic("route") + '<span class="grow">' + esc(txt) + '</span><span class="pen">' + ic("pen") + "</span></button>";
  }

  // ---- Geral ----
  function costLine(items) {
    var tot = {};
    items.forEach(function (it) { var v = num(it.valor); if (v > 0) { var c = it.moeda || "BRL"; tot[c] = (tot[c] || 0) + v; } });
    return Object.keys(tot).map(function (c) { return "<strong>" + esc(money(tot[c], c)) + "</strong>"; }).join(" · ");
  }
  function stat(k, v, s, warn) { return '<div class="stat' + (warn ? " warn" : "") + '"><div class="k">' + k + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + "</div></div>"; }
  function viewGeral(trip) {
    var all = tripItems(trip.id);
    var count = function (t) { return all.filter(function (i) { return i.tipo === t; }).length; };
    var nights = daysBetween(trip.inicio, trip.fim) || 0;
    var covered = {};
    all.filter(function (i) { return i.tipo === "hospedagem"; }).forEach(function (h) { var n = daysBetween(h.checkin, h.checkout) || 0; for (var k = 0; k < n; k++) covered[addDays(h.checkin, k)] = 1; });
    var air = {};
    all.filter(function (i) { return i.tipo === "voo" && i.chegada && i.partida && i.chegada.slice(0, 10) !== i.partida.slice(0, 10); }).forEach(function (v) { air[v.partida.slice(0, 10)] = 1; });
    var missing = [];
    for (var k = 0; k < nights; k++) { var dd = addDays(trip.inicio, k); if (!covered[dd] && !air[dd]) missing.push(ddmm(dd)); }
    var tick = tripItems(trip.id, "roteiro").filter(function (i) { return needsTicket(i) && !i.ingresso; }).length;
    var html = '<div class="summary">' +
      stat("Voos", count("voo"), "trechos aéreos") +
      stat("Noites sem hotel", missing.length, missing.length ? "noite de " + missing.join(", ") : "todas cobertas", missing.length) +
      stat("Ingressos a comprar", tick, "veja a aba Ingressos", tick) +
      stat("Atividades", count("roteiro"), all.filter(function (i) { return i.feito; }).length + " feitas") + "</div>";
    var custo = costLine(all);
    if (custo) html += '<div class="costs"><span class="k">Gasto lançado</span>' + custo + "</div>";
    if (trip.obs) html += '<div class="obs" style="margin-bottom:18px">' + esc(trip.obs) + "</div>";
    var days = tripDays(trip);
    var dot = { voo: "var(--wine)", hospedagem: "var(--gold)", passagem: "var(--muted)", roteiro: "var(--line)" };
    html += '<div class="section-head"><h2>Linha do tempo</h2></div>' + days.map(function (day, i) {
      var ev = dayEvents(all, day);
      if (!ev.length) return "";

        ev.map(function (e) {
          return '<button type="button" class="event' + (e.it.feito ? " done" : "") + '" style="--dot:' + dot[e.it.tipo] + '" data-edit="' + esc(e.it.id) + '"><span class="time">' + esc(e.time || "--:--") +
            '</span><span style="min-width:0"><span class="title">' + esc(e.title) + '</span><br><span class="sub">' + esc(e.sub) + '</span></span><span class="tag tag-' + e.it.tipo + '">' + TIPO_NOME[e.it.tipo] + "</span></button>";
        }).join("") + "</div></section>";

  }

  // ---- Voos, hospedagens, passagens ----
  function viewList(trip, tipo, titulo, cardFn) {

    var head = '<div class="section-head"><h2>' + titulo + '</h2><button class="btn btn-primary" type="button" data-add="' + tipo + '">+ ' + TIPO_NOME[tipo] + "</button></div>";

    return head + (custo ? '<div class="costs"><span class="k">Total</span>' + custo + "</div>" : "") + '<div class="cards">' + items.map(cardFn).join("") + "</div>";
  }
  function viewTransporte(trip) {
    var items = tripItems(trip.id).filter(function (i) { return i.tipo === "voo" || i.tipo === "passagem"; });
    var custo = costLine(items);
    var head = '<div class="section-head"><h2>Voos e trens</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" type="button" data-add="voo">+ Voo</button><button class="btn" type="button" data-add="passagem">+ Trem / ônibus</button></div></div>';
    if (!items.length) return head + '<div class="empty"><h3>Nada cadastrado</h3></div>';
    return head + (custo ? '<div class="costs"><span class="k">Total</span>' + custo + "</div>" : "") + '<div class="cards">' + items.map(function (i) { return i.tipo === "voo" ? cardVoo(i) : cardTrem(i); }).join("") + "</div>";
  }
  function cardTrem(it) {
    var dur = "";
    if (it.partida && it.chegada) { var mins = Math.round((parseDT(it.chegada) - parseDT(it.partida)) / 60000); if (mins > 0) dur = Math.floor(mins / 60) + "h" + String(mins % 60).padStart(2, "0"); }

    return '<button type="button" class="pass" data-edit="' + esc(it.id) + '"><div class="pass-main"><div class="pass-top"><span class="carrier">' + esc(it.empresa || it.meio || "Trem") + "</span><span>" + esc(fmtDay(it.partida)) + "</span></div>" +
      '<div class="route"><div><div class="code station">' + esc(it.origem || "") + '</div><div class="when">' + esc(hhmm(it.partida) || "--:--") + "</div></div>" +
      '<div class="plane"><span style="color:var(--gold)">' + ic("train") + "</span>" + esc(dur) + "</div>" +
      '<div class="end"><div class="code station">' + esc(it.destino || "") + '</div><div class="when">' + esc(hhmm(it.chegada) || "--:--") + "</div></div></div>" +
      (meta ? '<div class="pass-meta">' + meta + "</div>" : "") + (it.obs ? '<div class="obs" style="margin-top:10px">' + esc(it.obs) + "</div>" : "") + "</div>" +
      '<div class="pass-stub"><div><div class="k">Reserva</div><div class="loc">' + esc(it.codigo || "—") + "</div></div>" +
      (num(it.valor) ? '<div><div class="k">Valor</div><div class="price">' + esc(money(it.valor, it.moeda)) + "</div></div>" : "") + "</div></button>";
  }
  function cardVoo(it) {
    var dur = "";
    if (it.partida && it.chegada) { var mins = Math.round((parseDT(it.chegada) - parseDT(it.partida)) / 60000); if (mins > 0) dur = Math.floor(mins / 60) + "h" + String(mins % 60).padStart(2, "0"); }
    var meta = [["Assento", it.assento], ["Terminal", it.terminal], ["Bagagem", it.bagagem]].filter(function (m) { return m[1]; }).map(function (m) { return "<span>" + m[0] + "<b>" + esc(m[1]) + "</b></span>"; }).join("");
    var plus = it.chegada && it.partida && it.chegada.slice(0, 10) !== it.partida.slice(0, 10) ? " (+" + daysBetween(it.partida, it.chegada) + ")" : "";
    return '<button type="button" class="pass" data-edit="' + esc(it.id) + '"><div class="pass-main"><div class="pass-top"><span class="carrier">' + esc(it.cia || "Voo") + "</span><span>" + esc(it.numero || "") + " · " + esc(fmtDay(it.partida)) + "</span></div>" +
      '<div class="route"><div><div class="code">' + esc(it.origem || "---") + '</div><div class="city">' + esc(it.origemCidade || "") + '</div><div class="when">' + esc(hhmm(it.partida) || "--:--") + "</div></div>" +
      '<div class="plane"><span style="color:var(--gold)">' + ic("plane") + "</span>" + esc(dur) + "</div>" +
      '<div class="end"><div class="code">' + esc(it.destino || "---") + '</div><div class="city">' + esc(it.destinoCidade || "") + '</div><div class="when">' + esc(hhmm(it.chegada) || "--:--") + plus + "</div></div></div>" +

    var trip = existing ? currentTrip() : null;
    openSheet({
      title: trip ? "Editar viagem" : "Nova viagem", schema: VIAGEM_SCHEMA, data: trip || {}, deleteLabel: "Excluir viagem",
      onSave: function (vals) {
        var id = trip ? trip.id : newId();
        var rec = Object.assign({}, trip ? state.viagens[trip.id] : { criadoEm: new Date().toISOString() }, vals);
        state.tripId = id;
        return saveDoc("viagens", id, rec).then(function () { toast(trip ? "Viagem atualizada" : "Viagem criada"); });
      },
      onDelete: trip ? function () {
        var ids = tripItems(trip.id).map(function (i) { return i.id; });
        return ids.reduce(function (p, i) { return p.then(function () { return removeDoc("itens", i); }); }, Promise.resolve())
          .then(function () { return removeDoc("viagens", trip.id); }).then(function () { state.tripId = null; toast("Viagem excluída"); });
      } : null
    });
  }
  function openDesloc(key) {
    var trip = currentTrip(), d = state.deslocs[key];
    openSheet({
      title: "Deslocamento", schema: DESLOC_SCHEMA, data: d || { modo: "Metrô" }, deleteLabel: "Remover",
      onSave: function (vals) { return saveDoc("deslocs", key, Object.assign({ viagemId: trip.id }, vals)); },
      onDelete: d ? function () { return removeDoc("deslocs", key); } : null
    });
  }
  function openDoc(id) {
    var d = state.documentos[id];
    openSheet({
      title: "Documento", schema: DOC_SCHEMA, data: d, deleteLabel: "Excluir arquivo",
      onSave: function (vals) { return patchDoc("documentos", id, vals); },
      onDelete: function () {
        var p = (assets && d.assetId) ? assets.delete(d.assetId).catch(function () {}) : Promise.resolve();
        return p.then(function () { return removeDoc("documentos", id); }).then(function () { toast("Documento excluído"); });
      }
    });
  }

  // Duração com − e + (grava depois de uma pausa curta)
  var durTimers = {};
  function stepDur(id, step) {
    var it = state.itens[id]; if (!it) return;
    var v = Math.max(15, Math.min(720, (+it.duracao || 60) + step));
    it.duracao = v; render();
    clearTimeout(durTimers[id]);
    durTimers[id] = setTimeout(function () { patchDoc("itens", id, { duracao: v }).catch(function (e) { toast(errMsg(e)); }); }, 700);
  }

  // ---------- Avisos ----------
  var toastTimer;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2800); }
  function errMsg(e) {
    var c = e && e.code;
    if (c === "not_granted") return "Você não tem permissão para salvar nesta página.";
    if (c === "unavailable") return "Sem conexão no momento. Tente de novo em instantes.";
    if (c === "quota_exceeded" || c === "resource_exhausted") return "Limite de armazenamento atingido.";
    return "Não foi possível salvar. Tente novamente.";
  }
  function showErr(msg) { var el = $("sheet-err"); if (el) { el.textContent = msg; el.hidden = false; } }

  // ---------- Eventos ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button, a, .sheet-bg");
    if (!t) { $("add-menu").hidden = true; return; }
    if (t.tagName === "A") return;
    if (t.id === "sheet-bg" && e.target === t) { closeSheet(); return; }
    if (t.hasAttribute("data-close")) { closeSheet(); return; }
    var ds = t.dataset;
    if (ds.tab) { state.tab = ds.tab; boardPositioned = false; try { localStorage.setItem("kauri-tab2", state.tab); } catch (x) {} render(); return; }
    if (t.id === "fab" || ds.action === "menu") { var m = $("add-menu"); m.hidden = !m.hidden; e.stopPropagation(); return; }
    if (ds.action === "upload") { $("add-menu").hidden = true; $("file-input").click(); return; }
    if (ds.add) { $("add-menu").hidden = true; var pre = {}; if (ds.day) pre.data = ds.day; if (ds.cat) pre.categoria = ds.cat; openItem(ds.add, null, pre); return; }
    if (ds.edit) { var it = state.itens[ds.edit]; if (it) openItem(it.tipo, ds.edit); return; }
    if (ds.dur) { stepDur(ds.dur, +ds.step); return; }
    if (ds.desloc) { openDesloc(ds.desloc); return; }
    if (t.id === "btn-search") { searchPlace(currentTrip()); return; }
    if (ds.doc) { openDoc(ds.doc); return; }
    if (ds.jump != null) { var b = $("board"), c = b && b.querySelector('[data-col="' + ds.jump + '"]'); if (c) b.scrollTo({ left: c.offsetLeft - 16, behavior: "smooth" }); return; }
    if (ds.toggle) { var a = state.itens[ds.toggle]; if (a) patchDoc("itens", ds.toggle, { feito: !a.feito }).catch(function (x) { toast(errMsg(x)); }); return; }
    if (ds.ticket) { var tk = state.itens[ds.ticket]; if (tk) patchDoc("itens", ds.ticket, { ingresso: !tk.ingresso }).then(function () { toast(tk.ingresso ? "Ingresso desmarcado" : "Ingresso marcado como comprado"); }).catch(function (x) { toast(errMsg(x)); }); return; }
    if (t.id === "btn-new-trip" || ds.action === "new-trip") { openTrip(false); return; }
    if (t.id === "btn-edit-trip") { openTrip(true); return; }
    if (t.id === "sheet-del" && sheet) {
      if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Toque de novo para confirmar"; return; }
      t.disabled = true;
      sheet.onDelete().then(closeSheet).catch(function (x) { t.disabled = false; showErr(errMsg(x)); });
      return;
    }
    $("add-menu").hidden = true;
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "sheet-form" || !sheet) return;
    e.preventDefault();
    var vals = readForm(sheet.schema), msg = validate(sheet.schema, vals);
    if (msg) { showErr(msg); return; }
    var btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = "Salvando...";
    var s = sheet;
    s.onSave(vals).then(function () { if (sheet === s) closeSheet(); render(); }).catch(function (x) { btn.disabled = false; btn.textContent = "Salvar"; showErr(errMsg(x)); });
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "trip-select") { state.tripId = el.value; boardPositioned = false; render(); return; }
    if (el.id === "file-input") { uploadFiles(el.files); el.value = ""; return; }
    if (el.dataset && el.dataset.fx) {
      var trip = currentTrip(); if (!trip) return;
      var fx = Object.assign({}, trip.cambio || {}); fx[el.dataset.fx] = num(el.value);
      patchDoc("viagens", trip.id, { cambio: fx }).catch(function (x) { toast(errMsg(x)); });
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (sheet) closeSheet(); $("add-menu").hidden = true; } });
  setInterval(function () { var c = $("countdown"), trip = currentTrip(); if (c && trip) c.innerHTML = countdownHTML(trip); }, 30000);

  render();
  connect();
})();
</script>
