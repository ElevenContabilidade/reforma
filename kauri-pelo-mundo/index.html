<title>Kauri pelo mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: faixa bordô da marca + cartão da viagem com contagem regressiva; abas roláveis; roteiro em colunas por dia (rolagem lateral). */
:root {
  --bg: #ffffff;
  color-scheme: light;
  --surface: #ffffff;
  --surface-2: #f3ebe8;
  --ink: #2a1214;
  --muted: #7b6466;
  --line: #e9dcd8;
  --wine: #8c2426;
  --wine-soft: #fbeeee;
  --gold: #c9922b;
  --gold-soft: #fbf1d7;
  --gold-ink: #7a5714;
  --band: #6b1013;
  --band-2: #8c2426;
  --on-band: #fbf1d7;
  --on-wine: #ffffff;
  --ok: #2f7a4f;
  --ok-soft: #e3f2e9;
  --danger: #b3261e;
  --board: #efe3df;
  --metro: #2f7a4f;
  --train: #7a4fa0;
  --river: #2f7fb0;
  --paper: #f6efe4;
  --map-land: #f2efe9;
  --map-park: #c8e5c0;
  --map-water: #a9d3f2;
  --map-road: #ffffff;
  --map-casing: #d8d1c4;
  --map-major: #fad77e;
  --map-major-c: #e0b04b;
  --map-rail: #bdb5aa;
  --map-label: #5f6368;
  --map-halo: #ffffff;
  --grid: rgba(122, 87, 20, .10);
  --shadow: 0 1px 2px rgba(41, 6, 8, .06), 0 6px 20px rgba(41, 6, 8, .07);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
:root[data-theme="dark"] {
  --bg: #160b0c; --surface: #221315; --surface-2: #2c191b; --ink: #f6ece9; --muted: #b59f9f;
  --line: #3b2427; --wine: #e08a8c; --wine-soft: #3a1a1c; --gold: #e3b14e; --gold-soft: #3a2a12;
  --gold-ink: #f3d48f; --band: #3d0a0b; --band-2: #530d0f; --on-band: #fbf1d7; --on-wine: #1a0405;
  --ok: #7fcf9f; --ok-soft: #173325; --danger: #ff8a80; --board: #1d1012; --metro: #7fcf9f; --train: #c7a3e8; --river: #7fb8d8; --paper: #241618; --grid: rgba(227, 177, 78, .08); --map-land: #2a2326; --map-park: #2c3a2e; --map-water: #1c3247; --map-road: #4b4144; --map-casing: #3a3134; --map-major: #8d7031; --map-major-c: #6b5526; --map-rail: #5c5154; --map-label: #cdbcbc; --map-halo: #1a1214;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; }
svg.i { width: 18px; height: 18px; flex: none; }

/* Faixa da marca */
.band { background: linear-gradient(135deg, var(--band), var(--band-2)); color: var(--on-band); padding-block: 16px 64px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; line-height: 1; }
.brand-name span { color: var(--gold); }
.brand-sub { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-top: 3px; }
.trip-picker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.trip-picker select { background: rgba(251, 241, 215, .12); border: 1px solid rgba(251, 241, 215, .3); color: var(--on-band); border-radius: 8px; padding: 7px 10px; max-width: 200px; }
.trip-picker select option { color: #2a1214; background: #fff; }
.btn-band { background: transparent; border: 1px solid rgba(251, 241, 215, .4); color: var(--on-band); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; }
.btn-band:hover { background: rgba(251, 241, 215, .12); }

/* Cartão da viagem */
.trip-card { margin-top: -48px; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; position: relative; }
.trip-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); }
.trip-cover.has-photo { width: 84px; height: 84px; position: relative; border: 3px solid var(--gold); border-radius: 50%; padding: 0; overflow: hidden; background: var(--surface-2); }
.trip-cover.has-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.trip-cover .cover-edit { position: absolute; inset: auto 0 0 0; background: rgba(42, 18, 20, .6); color: #fff; font-size: 9px; font-weight: 700; padding: 3px 0 6px; text-align: center; opacity: 0; transition: opacity .15s; }
.trip-cover.has-photo:hover .cover-edit, .trip-cover.has-photo:focus-visible .cover-edit { opacity: 1; }
.trip-cover { width: 76px; height: 76px; border-radius: 14px; background: linear-gradient(160deg, var(--band-2), var(--band)); display: grid; place-items: center; }
.trip-top .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); font-weight: 800; }
.trip-top h1 { font-size: clamp(20px, 4.6vw, 28px); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; overflow-wrap: anywhere; }
.trip-dates { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin-top: 4px; }
.trip-edit { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; color: var(--muted); display: flex; }
.trip-bottom { padding: 18px 16px 20px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.trip-bottom h2 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.cd { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
.cd-unit { display: grid; gap: 4px; justify-items: center; }
.cd-unit .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.cd-digits { display: flex; gap: 5px; }
.cd-digits span { width: 38px; height: 48px; border-radius: 8px; background: var(--wine); color: var(--on-wine); font-family: var(--f-display); font-size: 30px; font-weight: 800; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.cd-msg { font-size: 15px; color: var(--muted); margin-top: 6px; }
.trip-illus { flex: none; }

/* Abas: no celular, todas visíveis em botões que quebram linha; no computador, coluna fixa à esquerda */
.shell { max-width: 960px; margin: 0 auto; padding-inline: 16px; }
.tabs-bar { background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 14px; padding-bottom: 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.tab .count { font-size: 11px; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: #fff; background: var(--wine); border-color: var(--wine); }
.tab[aria-selected="true"] .count { background: rgba(255, 255, 255, .22); color: #fff; }
@media (min-width: 900px) {
  .wrap { max-width: 1220px; }
  .shell { max-width: 1220px; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; align-items: start; }
  .tabs-bar { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); margin-top: 18px; border: 1px solid var(--line); border-radius: 16px; padding: 8px; background: var(--surface); box-shadow: var(--shadow); }
  .tabs { flex-direction: column; flex-wrap: nowrap; gap: 2px; }
  .tab { justify-content: space-between; border: 0; border-radius: 10px; padding: 10px 12px; font-size: 15px; background: transparent; text-align: left; }
  .tab:hover { background: var(--surface-2); color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--wine-soft); color: var(--wine); }
  .tab[aria-selected="true"] .count { background: var(--wine); color: #fff; }
}

main { padding-block: 18px 120px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.section-head h2 { font-size: 22px; font-weight: 700; }
.section-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--wine); }
.btn-primary { background: var(--wine); border-color: var(--wine); color: var(--on-wine); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn-danger { color: var(--danger); }
.btn-danger.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }

/* Roteiro em colunas */
.day-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
.day-chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip.today { border-color: var(--gold); color: var(--gold-ink); }
.board { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 14px 16px 18px; margin-inline: -16px; background: var(--board); border-radius: 0; scroll-padding-inline: 16px; }
@media (min-width: 992px) { .board { margin-inline: 0; border-radius: 18px; } }
.col { flex: 0 0 min(84vw, 330px); scroll-snap-align: start; display: grid; gap: 10px; align-content: start; min-width: 0; }
.col-head { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
.col-head .d { font-weight: 800; font-family: var(--f-display); font-size: 17px; line-height: 1.1; }
.col-head .c { font-size: 13px; color: var(--muted); }
.col-head .date { margin-left: auto; font-size: 14px; color: var(--muted); white-space: nowrap; }
.col-head.today { outline: 2px solid var(--gold); }
.col-body { background: var(--surface); border-radius: 14px; padding: 12px; display: grid; gap: 0; box-shadow: var(--shadow); }
.act { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--surface); }
.act.done { opacity: .55; }
.act.done .act-title { text-decoration: line-through; }
.thumb { width: 56px; height: 56px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); }
.thumb svg { width: 26px; height: 26px; }
.t-voo { background: var(--wine); color: var(--on-wine); }
.t-hospedagem { background: var(--gold); color: #2a1214; }
.t-passagem { background: var(--ink); color: var(--bg); }
.t-Museu { background: var(--gold-soft); color: var(--gold-ink); }
.t-Restaurante { background: var(--wine-soft); color: var(--wine); }
.t-Compras { background: var(--gold-soft); color: var(--gold-ink); }
.t-Show { background: var(--wine-soft); color: var(--wine); }
.t-Passeio { background: var(--ok-soft); color: var(--ok); }
.act-main { min-width: 0; display: grid; gap: 6px; }
.act-top { display: flex; align-items: flex-start; gap: 6px; }
.act-title { font-weight: 700; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.icon-btn { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 0; display: grid; place-items: center; padding: 0; }
.icon-btn.edit { background: var(--wine); color: var(--on-wine); }
.icon-btn.check { background: var(--surface-2); color: var(--muted); border: 1.5px solid var(--line); }
.icon-btn.check[aria-pressed="true"] { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.icon-btn svg { width: 16px; height: 16px; }
.act-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.act-time { display: flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-weight: 700; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.act-time svg { color: var(--muted); }
.act-sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper button { width: 28px; height: 28px; border-radius: 8px; border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--ink); padding: 0; }
.stepper button:hover { background: var(--surface-2); }
.stepper .v { font-family: var(--f-mono); font-weight: 700; font-size: 14px; color: var(--wine); min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
.desloc { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 10px 4px; color: var(--muted); font-size: 14px; font-weight: 600; text-align: left; width: 100%; }
.desloc .grow { flex: 1; }
.desloc.set { color: var(--ink); }
.desloc .pen { width: 22px; height: 22px; border-radius: 6px; background: var(--wine); color: var(--on-wine); display: grid; place-items: center; }
.desloc .pen svg { width: 12px; height: 12px; }
.act[data-drag] { cursor: grab; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.act[data-drag] img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
.act.holding { box-shadow: 0 0 0 3px var(--gold); transition: box-shadow .15s; }
.icon-btn.mv { touch-action: none; cursor: grab; }
body.is-dragging .board { scroll-snap-type: none; }
.chip.drop-chip { background: var(--gold); border-color: var(--gold); color: #2a1214; }
body.is-dragging .day-chips { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 50px); z-index: 6; background: var(--bg); padding-block: 6px; flex-wrap: wrap; }
.drag-ghost { position: fixed; z-index: 40; pointer-events: none; box-shadow: 0 12px 30px rgba(41, 6, 8, .3); transform: rotate(2deg); opacity: .95; }
body.is-dragging, body.is-dragging * { user-select: none; cursor: grabbing !important; }
.act.dragging { opacity: .35; }
.act.drop-before { box-shadow: 0 -3px 0 var(--gold); }
.col-body.drop-end { outline: 2px dashed var(--gold); outline-offset: -4px; }
.act-tools { display: flex; gap: 6px; }
.icon-btn.mv { background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--line); }
.desloc .dtxt { display: grid; gap: 1px; }
.desloc .dsub { font-size: 12px; font-weight: 500; color: var(--muted); }
.col-tools { display: flex; gap: 8px; margin-top: 10px; }
.col-tools .col-add { margin-top: 0; flex: 1; }
.mv-list { display: grid; gap: 6px; margin: 6px 0 4px; }
.mv-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.mv-row.me { border-color: var(--wine); background: var(--wine-soft); font-weight: 700; }
.mv-row .h { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 44px; }
.col-add { margin-top: 10px; border: 1.5px dashed var(--line); background: transparent; border-radius: 12px; padding: 10px; font-weight: 600; color: var(--muted); }
.col-add:hover { border-color: var(--wine); color: var(--wine); }
.col-empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }

/* Resumo */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.stat .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stat .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--muted); }
.stat.warn { border-color: var(--gold); }
.costs { background: var(--gold-soft); color: var(--gold-ink); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; font-size: 14px; }
.costs strong { font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.costs .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.cost-total { margin-left: auto; display: grid; justify-items: end; gap: 0; padding-left: 18px; border-left: 1px solid rgba(122, 87, 20, .25); color: var(--ink); }
.cost-total strong { font-size: 26px; line-height: 1.15; color: var(--wine); }
.cost-total small { font-size: 11px; color: var(--gold-ink); }
@media (max-width: 640px) { .cost-total { margin-left: 0; width: 100%; justify-items: start; padding: 10px 0 0; border-left: 0; border-top: 1px solid rgba(122, 87, 20, .25); } }

/* Linha do tempo */
.day { margin-bottom: 20px; }
.day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.dnum { font-family: var(--f-mono); font-size: 12px; color: var(--gold-ink); background: var(--gold-soft); padding: 2px 8px; border-radius: 6px; font-weight: 700; white-space: nowrap; }
.day-head h3 { font-size: 17px; font-weight: 700; text-transform: capitalize; }
.events { display: grid; gap: 6px; border-left: 2px solid var(--line); margin-left: 6px; padding-left: 16px; }
.event { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; }
.event::before { content: ""; position: absolute; left: -23px; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--dot, var(--wine)); transform: translateY(-50%); }
.event:hover { border-color: var(--wine); }
.event .time { font-family: var(--f-mono); font-size: 13px; font-weight: 700; color: var(--muted); }
.event .title { font-weight: 700; overflow-wrap: anywhere; }
.event .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.event.done .title { text-decoration: line-through; opacity: .6; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.tag-voo { background: var(--wine); color: var(--on-wine); }
.tag-hospedagem { background: var(--gold-soft); color: var(--gold-ink); }
.tag-passagem { background: var(--surface-2); color: var(--ink); }
.tag-roteiro { background: transparent; color: var(--muted); border: 1px solid var(--line); }

/* Cartão de embarque */
.cards { display: grid; gap: 14px; }
.pass { display: grid; grid-template-columns: minmax(0, 1fr) 170px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; text-align: left; width: 100%; padding: 0; }
.pass:hover { border-color: var(--wine); }
.pass-main { padding: 14px 18px 16px; min-width: 0; }
.pass-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.pass-top .carrier { color: var(--wine); font-weight: 800; }
.route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; margin-top: 10px; }
.route .code { font-family: var(--f-mono); font-size: clamp(28px, 7vw, 40px); font-weight: 700; line-height: 1; }
.route .code.station { font-family: var(--f-display); font-size: clamp(17px, 4vw, 22px); line-height: 1.15; overflow-wrap: anywhere; }
.route .city { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.route .when { font-family: var(--f-mono); font-size: 13px; font-weight: 700; margin-top: 4px; }
.route .end { text-align: right; }
.route .plane { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.pass-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.pass-meta b { display: block; color: var(--ink); font-family: var(--f-mono); font-size: 13px; }
.pass-stub { border-left: 2px dashed var(--line); position: relative; padding: 14px 16px; background: var(--surface-2); display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
.pass-stub::before, .pass-stub::after { content: ""; position: absolute; left: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.pass-stub::before { top: -11px; }
.pass-stub::after { bottom: -11px; }
.pass-stub .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

      (city ? " Cidade provável: " + city + "." : "") + " Viagem: " + (trip.destino || "") + "." +
      " Liste até 5 lugares reais que correspondem ao que foi digitado, do mais provável para o menos provável." +
      " Responda somente com JSON neste formato: {\"lugares\":[{\"nome\":\"nome oficial\",\"cidade\":\"cidade em português\",\"endereco\":\"rua e número\",\"categoria\":\"uma de: " + CATS.join(", ") + "\",\"duracao\":minutos de visita típicos (número),\"precisaIngresso\":true ou false,\"dica\":\"uma frase curta em português: horário de funcionamento, preço aproximado na moeda local e se precisa reservar\",\"historia\":\"3 frases curtas em português sobre a história do lugar: quando foi criado, por quem e por que é famoso\",\"lat\":latitude (número),\"lng\":longitude (número)}]}." +
      " Se não reconhecer o lugar, responda {\"lugares\":[]}.";
    sampler.json(prompt, { modelTier: "quick", signal: searchCtl.signal }).then(function (r) {
      var list = (r && r.lugares) || [];
      if (!list.length) { sugs.innerHTML = '<div class="sug-msg">Nenhum lugar encontrado com esse nome. Confira a grafia ou preencha à mão.</div>'; return; }
      sugs.innerHTML = '<div class="sug-msg">Toque em uma opção para preencher:</div>' + list.slice(0, 5).map(function (l, i) {
        return '<button type="button" class="sug" data-sug="' + i + '"><b>' + esc(l.nome) + "</b><span>" + esc([l.endereco, l.cidade].filter(Boolean).join(", ")) + "</span><span>" + esc([l.categoria, l.duracao ? durFmt(l.duracao) + " de visita" : "", l.precisaIngresso ? "precisa de ingresso" : ""].filter(Boolean).join(" · ")) + "</span>" + (l.dica ? "<span>" + esc(l.dica) + "</span>" : "") + "</button>";
      }).join("");
      sugs.onclick = function (e) {
        var b = e.target.closest("[data-sug]"); if (!b) return;
        var l = list[+b.dataset.sug];
        var set = function (k, v) { var el = $("f-" + k); if (el && v != null && v !== "") { if (el.type === "checkbox") el.checked = !!v; else el.value = v; } };
        set("titulo", l.nome); set("local", l.cidade); set("endereco", l.endereco);
        if (CATS.indexOf(l.categoria) >= 0) set("categoria", l.categoria);
        if (+l.duracao > 0) set("duracao", Math.round(+l.duracao / 15) * 15 || 15);
        set("precisaIngresso", !!l.precisaIngresso);
        pendingPlace = { historia: l.historia || "", lat: +l.lat || "", lng: +l.lng || "" };
        var obs = $("f-obs"); if (obs && l.dica && obs.value.indexOf(l.dica) < 0) obs.value = (obs.value ? obs.value + "\n" : "") + l.dica;
        sugs.innerHTML = '<div class="sug-msg">Preenchido. Confira e toque em Salvar.</div>';
        title.dispatchEvent(new Event("input"));
      };
    }).catch(function (e) {
      if (e && e.code === "cancelled") return;
      sugs.innerHTML = '<div class="sug-msg">' + (e && e.code === "not_granted" ? "A busca precisa da sua permissão para usar o Claude." : e && e.code === "rate_limited" ? "Muitas buscas seguidas. Espere um pouco e tente de novo." : "Não foi possível buscar agora. Preencha à mão ou tente de novo.") + "</div>";
    }).then(function () { if (btn) btn.disabled = false; });
  }
  function defaultsFor(tipo, trip) {
    var d = { moeda: "BRL" };
    if (tipo === "roteiro") { d.data = trip.inicio; d.categoria = "Passeio"; d.duracao = 60; d.moeda = "EUR"; }
    if (tipo === "hospedagem") { d.checkin = trip.inicio; d.checkout = trip.fim; }
    if (tipo === "voo" || tipo === "passagem") d.partida = trip.inicio ? trip.inicio + "T08:00" : "";
    return d;
  }
  function openTrip(existing) {
    var trip = existing ? currentTrip() : null;
    openSheet({
      title: trip ? "Editar viagem" : "Nova viagem", schema: VIAGEM_SCHEMA, data: trip || {}, deleteLabel: "Excluir viagem",
      onSave: function (vals) {
        var id = trip ? trip.id : newId();
        var rec = Object.assign({}, trip ? state.viagens[trip.id] : { criadoEm: new Date().toISOString() }, vals);
        state.tripId = id;
        return saveDoc("viagens", id, rec).then(function () { toast(trip ? "Viagem atualizada" : "Viagem criada"); });
      },
      onDelete: trip ? function () {
        var ids = tripItems(trip.id).map(function (i) { return i.id; });
        return ids.reduce(function (p, i) { return p.then(function () { return removeDoc("itens", i); }); }, Promise.resolve())
          .then(function () { return removeDoc("viagens", trip.id); }).then(function () { state.tripId = null; toast("Viagem excluída"); });
      } : null
    });
  }
  function openDesloc(key) {
    var trip = currentTrip(), d = state.deslocs[key];
    openSheet({
      title: "Deslocamento", schema: DESLOC_SCHEMA, data: d || { modo: "Metrô" }, deleteLabel: "Remover",
      onSave: function (vals) { return saveDoc("deslocs", key, Object.assign({ viagemId: trip.id }, vals)); },
      onDelete: d ? function () { return removeDoc("deslocs", key); } : null
    });
  }
  function openDoc(id) {
    var d = state.documentos[id];
    openSheet({
      title: "Documento", schema: DOC_SCHEMA, data: d, deleteLabel: "Excluir arquivo",
      onSave: function (vals) { return patchDoc("documentos", id, vals); },
      onDelete: function () {
        var p = (assets && d.assetId) ? assets.delete(d.assetId).catch(function () {}) : Promise.resolve();
        return p.then(function () { return removeDoc("documentos", id); }).then(function () { toast("Documento excluído"); });
      }
    });
  }

  // Duração com − e + (grava depois de uma pausa curta)
  var durTimers = {};
  function stepDur(id, step) {
    var it = state.itens[id]; if (!it) return;
    var v = Math.max(15, Math.min(720, (+it.duracao || 60) + step));
    it.duracao = v; render();
    clearTimeout(durTimers[id]);
    durTimers[id] = setTimeout(function () { patchDoc("itens", id, { duracao: v }).catch(function (e) { toast(errMsg(e)); }); }, 700);
  }

  // ---------- Avisos ----------
  var toastTimer;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2800); }
  function errMsg(e) {
    var c = e && e.code;
    if (c === "not_granted") return "Você não tem permissão para salvar nesta página.";
    if (c === "unavailable") return "Sem conexão no momento. Tente de novo em instantes.";
    if (c === "quota_exceeded" || c === "resource_exhausted") return "Limite de armazenamento atingido.";
    return "Não foi possível salvar. Tente novamente.";
  }
  function showErr(msg) { var el = $("sheet-err"); if (el) { el.textContent = msg; el.hidden = false; } }

  // ---------- Eventos ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button, a, .sheet-bg");
    if (!t) { $("add-menu").hidden = true; return; }
    if (t.tagName === "A") return;
    if (t.id === "sheet-bg" && e.target === t) { closeSheet(); return; }
    if (t.hasAttribute("data-close")) { closeSheet(); return; }
    var ds = t.dataset;
    if (ds.tab) { if (mapFull) { mapFull = false; document.body.style.overflow = ""; } state.tab = ds.tab; boardPositioned = false; try { localStorage.setItem("kauri-tab2", state.tab); } catch (x) {} render(); return; }
    if (t.id === "fab" || ds.action === "menu") { var m = $("add-menu"); m.hidden = !m.hidden; e.stopPropagation(); return; }
    if (ds.action === "cover") { if (!assets) { toast("Para trocar a foto, abra pelo app do Claude."); return; } $("cover-input").click(); return; }
    if (ds.action === "upload") { $("add-menu").hidden = true; openUpload(); return; }
    if (ds.add) { $("add-menu").hidden = true; var pre = {}; if (ds.day) pre.data = ds.day; if (ds.cat) pre.categoria = ds.cat; openItem(ds.add, null, pre); return; }
    if (ds.edit) { var it = state.itens[ds.edit]; if (it) { closeSheet(); openItem(it.tipo, ds.edit); } return; }
    if (ds.dur) { stepDur(ds.dur, +ds.step); return; }
    if (ds.detail) { openDetail(ds.detail); return; }
    if (ds.move) { openMove(ds.move); return; }
    if (ds.recalc) { recalcDay(ds.recalc); return; }
    if (ds.mvstep && sheet && sheet.move) {
      var mid = sheet.move, mit = state.itens[mid], tr = currentTrip(), ord = dayActs(tr, mit.data), ix = ord.findIndex(function (x) { return x.id === mid; });
      var rc = $("mv-recalc") ? $("mv-recalc").checked : true;
      if (+ds.mvstep < 0 && ix > 0) moveItem(mid, mit.data, ord[ix - 1].id, rc);
      if (+ds.mvstep > 0 && ix < ord.length - 1) moveItem(mid, mit.data, ord[ix + 2] ? ord[ix + 2].id : null, rc);
      setTimeout(function () { if (sheet && sheet.move === mid) openMove(mid); }, 0);
      return;
    }
    if (ds.mvday) { var dd = $("mv-day").value, rc2 = $("mv-recalc").checked, mid2 = ds.mvday; closeSheet(); if (dd !== state.itens[mid2].data) moveItem(mid2, dd, "@time", rc2); return; }
    if (ds.ck) { var trc = currentTrip(); if (!trc) return; var ckId = trc.id + "_" + ds.ck, cur = state.checklist[ckId]; saveDoc("checklist", ckId, { viagemId: trc.id, feito: !(cur && cur.feito) }).catch(function (x) { toast(errMsg(x)); }); return; }
    if (ds.mapday) { mapDay = ds.mapday; render(); return; }
    if (ds.mapfull) { mapFull = !mapFull; mz.day = null; document.body.style.overflow = mapFull ? "hidden" : ""; render(); return; }
    if (ds.mz) { var cc = $("map-canvas"); if (!cc) return; if (ds.mz === "reset") { mz.s = 1; mz.tx = 0; mz.ty = 0; mzApply(); } else mzZoomAt(ds.mz === "in" ? 1.5 : 1 / 1.5, cc.clientWidth / 2, cc.clientHeight / 2); return; }
    if (ds.genhist) { genHistoria(ds.genhist, t); return; }
    if (ds.addphoto) { photoFor = ds.addphoto; $("photo-input").click(); return; }
    if (ds.desloc) { openDesloc(ds.desloc); return; }
    if (t.id === "btn-search") { searchPlace(currentTrip()); return; }
    if (ds.doc) { openDoc(ds.doc); return; }
    if (ds.viewdoc) { openDocViewer(ds.viewdoc); return; }
    if (ds.dldoc) { downloadDoc(ds.dldoc, t); return; }
    if (ds.jump != null) { var b = $("board"), c = b && b.querySelector('[data-col="' + ds.jump + '"]'); if (c) b.scrollTo({ left: c.offsetLeft - 16, behavior: "smooth" }); return; }
    if (ds.toggle) { var a = state.itens[ds.toggle]; if (a) patchDoc("itens", ds.toggle, { feito: !a.feito }).then(function () { if (sheet && sheet.detail === ds.toggle) openDetail(ds.toggle); }).catch(function (x) { toast(errMsg(x)); }); return; }
    if (ds.ticket) { var tk = state.itens[ds.ticket]; if (tk) patchDoc("itens", ds.ticket, { ingresso: !tk.ingresso }).then(function () { toast(tk.ingresso ? "Ingresso desmarcado" : "Ingresso marcado como comprado"); }).catch(function (x) { toast(errMsg(x)); }); return; }
    if (t.id === "btn-new-trip" || ds.action === "new-trip") { openTrip(false); return; }
    if (t.id === "btn-edit-trip") { openTrip(true); return; }
    if (t.id === "sheet-del" && sheet) {
      if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Toque de novo para confirmar"; return; }
      t.disabled = true;
      sheet.onDelete().then(closeSheet).catch(function (x) { t.disabled = false; showErr(errMsg(x)); });
      return;
    }
    $("add-menu").hidden = true;
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "sheet-form" || !sheet) return;
    e.preventDefault();
    var vals = readForm(sheet.schema), msg = validate(sheet.schema, vals);
    if (msg) { showErr(msg); return; }
    var btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = "Salvando...";
    var s = sheet;
    s.onSave(vals).then(function () { if (sheet === s) closeSheet(); render(); }).catch(function (x) { btn.disabled = false; btn.textContent = "Salvar"; showErr(errMsg(x)); });
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "trip-select") { state.tripId = el.value; boardPositioned = false; render(); return; }
    if (el.id === "file-input") { uploadFiles(el.files); el.value = ""; return; }
    if (el.id === "cover-input") {
      var f = el.files[0], tr = currentTrip(); el.value = "";
      if (!f || !tr || !assets) return;
      toast("Enviando a foto...");
      assets.upload(f).then(function (r) { return patchDoc("viagens", tr.id, { fotoCapa: r.url, fotoCapaId: r.id }); })
        .then(function () { toast("Foto atualizada"); }).catch(function (x) { toast(errMsg(x)); });
      return;
    }
    if (el.id === "f-arquivos") { var nm = $("f-nome"); if (nm && !nm.value && el.files.length === 1) nm.value = el.files[0].name.replace(/\.[^.]+$/, "").replace(/[_]+/g, " "); return; }
    if (el.id === "photo-input") { uploadPhoto(el.files[0]); el.value = ""; return; }
    if (el.dataset && el.dataset.fx) {
      var trip = currentTrip(); if (!trip) return;
      var fx = Object.assign({}, trip.cambio || {}); fx[el.dataset.fx] = num(el.value);
      patchDoc("viagens", trip.id, { cambio: fx }).catch(function (x) { toast(errMsg(x)); });
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && mapFull && !sheet) { mapFull = false; mz.day = null; document.body.style.overflow = ""; render(); return; } if (e.key === "Escape") { if (sheet) closeSheet(); $("add-menu").hidden = true; } });
  // Arrastar cartões do roteiro (mouse: o cartão inteiro; toque: pelo botão ↕)
  var drag = null, dropAt = null, suppressClick = false;
  function clearDrop() { document.querySelectorAll(".drop-before,.drop-end,.drop-chip").forEach(function (n) { n.classList.remove("drop-before", "drop-end", "drop-chip"); }); }
  document.addEventListener("dragstart", function (e) { if (e.target.closest && e.target.closest("[data-drag]")) e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (drag && (drag.active || drag.held)) e.preventDefault(); }, { passive: false });
  document.addEventListener("pointerdown", function (e) {
    if (state.tab !== "roteiro" || sheet || e.button > 0) return;
    var card = e.target.closest && e.target.closest("[data-drag]"); if (!card) return;
    var onHandle = !!e.target.closest(".icon-btn.mv");
    var btn = e.target.closest("button");
    if (btn && !onHandle && !btn.classList.contains("act-open")) return;
    drag = { id: card.dataset.drag, x: e.clientX, y: e.clientY, active: false, card: card, held: e.pointerType === "mouse" || onHandle };
    if (!drag.held) {
      var dd = drag;
      dd.timer = setTimeout(function () { if (drag === dd) { dd.held = true; card.classList.add("holding"); } }, 350);
    }
  });
  function findDrop(x, y) {
    var el = document.elementFromPoint(x, y); if (!el) return null;
    var chip = el.closest("[data-chipday]");
    if (chip) return { day: chip.dataset.chipday, before: null, chip: chip, byTime: true };
    var body = el.closest("[data-dropday]"); if (!body) return null;
    var cards = Array.prototype.slice.call(body.querySelectorAll("[data-drag]")).filter(function (c) { return c.dataset.drag !== drag.id; });
    var before = null;
    for (var i = 0; i < cards.length; i++) { var r = cards[i].getBoundingClientRect(); if (y < r.top + r.height / 2) { before = cards[i]; break; } }
    return { day: body.dataset.dropday, before: before, body: body };
  }
  document.addEventListener("pointermove", function (e) {
    if (!drag) return;
    if (!drag.active) {
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 7) return;
      if (!drag.held) { clearTimeout(drag.timer); drag = null; return; }
      drag.card.classList.remove("holding");
      drag.active = true;
      var r = drag.card.getBoundingClientRect();
      drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
      var g = drag.card.cloneNode(true); g.className += " drag-ghost"; g.style.width = r.width + "px"; document.body.appendChild(g); drag.ghost = g;
      drag.card.classList.add("dragging"); document.body.classList.add("is-dragging");
    }
    e.preventDefault();
    drag.ghost.style.left = (e.clientX - drag.dx) + "px"; drag.ghost.style.top = (e.clientY - drag.dy) + "px";
    clearDrop();
    dropAt = findDrop(e.clientX, e.clientY);
    if (dropAt) { if (dropAt.chip) dropAt.chip.classList.add("drop-chip"); else if (dropAt.before) dropAt.before.classList.add("drop-before"); else dropAt.body.classList.add("drop-end"); }
    drag.px = e.clientX; drag.py = e.clientY;
    if (Math.abs(e.clientX - drag.x) > 40 || Math.abs(e.clientY - drag.y) > 40) drag.armed = true;
    if (!drag.raf) drag.raf = requestAnimationFrame(autoScroll);
  }, { passive: false });
  function autoScroll() {
    if (!drag || !drag.active) return;
    drag.raf = null;
    var bd = $("board"), moved = false;
    if (drag.armed && bd) {
      var br = bd.getBoundingClientRect(), zone = 60;
      if (drag.px < br.left + zone) { bd.scrollLeft -= 14; moved = true; }
      else if (drag.px > br.right - zone) { bd.scrollLeft += 14; moved = true; }
    }
    if (drag.armed && drag.py < 90) { window.scrollBy(0, -12); moved = true; }
    else if (drag.armed && drag.py > window.innerHeight - 70) { window.scrollBy(0, 12); moved = true; }
    if (moved) {
      clearDrop(); dropAt = findDrop(drag.px, drag.py);
      if (dropAt) { if (dropAt.chip) dropAt.chip.classList.add("drop-chip"); else if (dropAt.before) dropAt.before.classList.add("drop-before"); else dropAt.body.classList.add("drop-end"); }
    }
    drag.raf = requestAnimationFrame(autoScroll);
  }
  function endDrag() {
    if (!drag) return;
    var d = drag; drag = null;
    clearTimeout(d.timer); d.card.classList.remove("holding");
    if (!d.active) return;
    if (d.raf) cancelAnimationFrame(d.raf);
    if (d.ghost) d.ghost.remove();
    d.card.classList.remove("dragging"); document.body.classList.remove("is-dragging"); clearDrop();
    suppressClick = true; setTimeout(function () { suppressClick = false; }, 300);
    if (dropAt) moveItem(d.id, dropAt.day, dropAt.before ? dropAt.before.dataset.drag : (dropAt.byTime ? "@time" : null), true);
    dropAt = null;
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
  document.addEventListener("click", function (e) { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { if (state.tab === "mapas" && !sheet) { mz.day = null; render(); } }, 250); });
  setInterval(function () { var c = $("countdown"), trip = currentTrip(); if (c && trip) c.innerHTML = countdownHTML(trip); }, 30000);

  render();
  connect();
})();
</script>
